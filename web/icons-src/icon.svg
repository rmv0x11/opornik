<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b78a55"/>
      <stop offset="0.5" stop-color="#8a5a32"/>
      <stop offset="1" stop-color="#512f1b"/>
    </linearGradient>
    <linearGradient id="felt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#247054"/>
      <stop offset="1" stop-color="#1a5139"/>
    </linearGradient>
    <radialGradient id="wht" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#fffdf6"/>
      <stop offset="0.7" stop-color="#efe6d4"/>
      <stop offset="1" stop-color="#cdbf9f"/>
    </radialGradient>
    <radialGradient id="blk" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#5a5a66"/>
      <stop offset="0.6" stop-color="#2e2e38"/>
      <stop offset="1" stop-color="#16161c"/>
    </radialGradient>
  </defs>

  <!-- wood frame -->
  <rect x="0" y="0" width="512" height="512" rx="96" fill="url(#wood)"/>
  <rect x="10" y="10" width="492" height="492" rx="88" fill="none" stroke="#44281a" stroke-width="6" opacity="0.55"/>

  <!-- felt -->
  <rect x="56" y="56" width="400" height="400" rx="48" fill="url(#felt)"/>
  <rect x="56" y="56" width="400" height="400" rx="48" fill="none" stroke="#15482f" stroke-width="6" opacity="0.8"/>

  <!-- points (triangles) from the top -->
  <path d="M96 76 L156 76 L126 268 Z" fill="#d8b98a"/>
  <path d="M176 76 L236 76 L206 268 Z" fill="#a9743f"/>
  <path d="M276 76 L336 76 L306 268 Z" fill="#d8b98a"/>
  <path d="M356 76 L416 76 L386 268 Z" fill="#a9743f"/>

  <!-- checkers -->
  <circle cx="186" cy="356" r="74" fill="url(#wht)"/>
  <circle cx="186" cy="356" r="74" fill="none" stroke="#a99a78" stroke-width="5" opacity="0.7"/>
  <circle cx="186" cy="356" r="46" fill="none" stroke="#bfb190" stroke-width="6" opacity="0.8"/>

  <circle cx="330" cy="380" r="74" fill="url(#blk)"/>
  <circle cx="330" cy="380" r="74" fill="none" stroke="#0c0c10" stroke-width="5" opacity="0.8"/>
  <circle cx="330" cy="380" r="46" fill="none" stroke="#6a6a78" stroke-width="6" opacity="0.7"/>
</svg>
